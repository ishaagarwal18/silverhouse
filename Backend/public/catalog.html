<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SilverHouse Studio - Luxury Silver Jewelry Catalog</title>

    <!-- Google Fonts & Phosphor Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-card: #f1f5f9;
            --surface-hover: #e2e8f0;
            --border: #e2e8f0;
            --border-focus: #6366f1;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-glow: rgba(79, 70, 229, 0.2);
            --accent: #0284c7;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --sidebar-width: 290px;
            --radius: 14px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --input-bg: #ffffff;
            --input-text: #0f172a;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --card-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            --topbar-border: #e2e8f0;
            --bg-gradient: radial-gradient(circle at top center, rgba(99, 102, 241, 0.08), transparent 45%);
            --header-bg: rgba(255, 255, 255, 0.85);
            --card-media-bg: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg: #0b0f19;
            --surface: #111827;
            --surface-card: #1f2937;
            --surface-hover: #374151;
            --border: #374151;
            --border-focus: #6366f1;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --accent: #38bdf8;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #1f2937;
            --input-text: #ffffff;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            --topbar-border: rgba(255, 255, 255, 0.06);
            --bg-gradient: radial-gradient(circle at top center, rgba(99, 102, 241, 0.07), transparent 45%);
            --header-bg: rgba(17, 24, 39, 0.85);
            --card-media-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ================= SIDEBAR FILTER PANEL ================= */
        .sidebar-filter {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 18px;
            gap: 20px;
            z-index: 20;
            overflow-y: auto;
            height: 100vh;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .brand-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-subtitle {
            font-size: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
        }

        .btn-theme-toggle {
            background: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 17px;
            transition: var(--transition);
        }

        .btn-theme-toggle:hover {
            background: var(--surface-hover);
            transform: scale(1.05);
        }

        .filter-section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            font-weight: 700;
            padding: 0 2px;
        }

        .filter-group-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .filter-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-field label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .filter-field select,
        .filter-field input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 9px 12px;
            border-radius: 8px;
            color: var(--input-text);
            font-size: 13px;
            outline: none;
            transition: var(--transition);
        }

        .filter-field select option {
            background: var(--surface);
            color: var(--text-main);
        }

        .filter-field select:focus,
        .filter-field input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }

        .radio-item,
        .checkbox-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 8px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: var(--transition);
            color: var(--text-main);
        }

        .radio-item:hover,
        .checkbox-item:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
        }

        .radio-item.active,
        .checkbox-item.active {
            background: var(--primary-glow);
            border-color: var(--primary);
            font-weight: 700;
        }

        .radio-item input[type="radio"],
        .checkbox-item input[type="checkbox"] {
            accent-color: var(--primary);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .pill-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .pill-btn {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 600;
            background: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
        }

        .pill-btn:hover {
            background: var(--surface-hover);
        }

        .pill-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            font-weight: 700;
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        .count-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            background: var(--surface-hover);
            color: var(--text-muted);
        }

        .search-field {
            position: relative;
        }

        .search-field i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
        }

        .search-field input {
            padding-left: 32px;
        }

        .btn-reset-sidebar {
            margin-top: 10px;
            width: 100%;
            background: rgba(239, 68, 68, 0.08);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-reset-sidebar:hover {
            background: rgba(239, 68, 68, 0.16);
        }

        /* ================= MAIN CONTENT VIEW ================= */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            background: var(--bg-gradient);
            background-color: var(--bg);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 36px;
            border-bottom: 1px solid var(--topbar-border);
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .title-box h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .title-box p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-secondary {
            background: var(--surface-card);
            color: var(--text-main);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
        }

        .content-area {
            padding: 32px 36px;
            flex: 1;
        }

        /* ================= PRODUCTS GRID ================= */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
        }

        .card-media {
            position: relative;
            width: 100%;
            height: 250px;
            background: var(--card-media-bg);
            overflow: hidden;
        }

        .card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .card-media img {
            transform: scale(1.04);
        }

        .badge-discount {
            position: absolute;
            top: 12px;
            left: 12px;
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: #fff;
            font-size: 10.5px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            z-index: 2;
        }

        .badge-category {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 10.5px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            z-index: 2;
        }

        .badge-purity {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(56, 189, 248, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent);
            font-size: 10.5px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            z-index: 2;
        }

        .card-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 10px;
        }

        .product-title {
            font-size: 15.5px;
            font-weight: 700;
            line-height: 1.35;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 42px;
        }

        .product-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .specs-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            flex-wrap: wrap;
        }

        .spec-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .spec-pill i {
            color: var(--primary);
        }

        .spec-pill.audience-pill {
            color: var(--accent);
            border-color: rgba(56, 189, 248, 0.25);
            background: rgba(56, 189, 248, 0.06);
        }

        .price-section {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .final-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
        }

        .original-price {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .stock-tag {
            margin-left: auto;
            font-size: 10.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .in-stock {
            color: var(--success);
        }

        .out-of-stock {
            color: var(--danger);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 20px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
        }

        .empty-state i {
            font-size: 48px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <!-- ================= SIDEBAR FILTER CONTROLS ================= -->
    <aside class="sidebar-filter">
        <div class="brand-header">
            <a href="/catalog" class="brand-box">
                <div class="brand-logo">
                    <i class="ph-bold ph-gem"></i>
                </div>
                <div>
                    <div class="brand-title">SilverHouse</div>
                    <div class="brand-subtitle">Jewelry Catalog</div>
                </div>
            </a>
            <button class="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Light / Dark Mode">
                <i class="ph-bold ph-moon" id="sidebarThemeIcon"></i>
            </button>
        </div>

        <div class="filter-section-title">
            <span>Filter Catalog</span>
            <i class="ph-bold ph-faders"></i>
        </div>

        <div class="filter-group-list">
            <!-- 1. Search Query -->
            <div class="filter-field search-field">
                <label>Search Keyword</label>
                <i class="ph-bold ph-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search item, style..." oninput="applyAllFilters()" />
            </div>

            <!-- 2. Target Audience (Pill Buttons) -->
            <div class="filter-field">
                <label>Target Audience</label>
                <div class="pill-group" id="audiencePills">
                    <button class="pill-btn active" data-val="" onclick="setAudience('')">All</button>
                    <button class="pill-btn" data-val="Women" onclick="setAudience('Women')">Women</button>
                    <button class="pill-btn" data-val="Men" onclick="setAudience('Men')">Men</button>
                    <button class="pill-btn" data-val="Kids" onclick="setAudience('Kids')">Kids</button>
                    <button class="pill-btn" data-val="ALL" onclick="setAudience('ALL')">Unisex</button>
                </div>
            </div>

            <!-- 3. Category Filter (Radio Group) -->
            <div class="filter-field">
                <label>Categories & Collections</label>
                <div class="radio-group" id="categoryOptions"></div>
            </div>

            <!-- 4. Silver Purity Filter (Radio Group) -->
            <div class="filter-field">
                <label>Silver Purity</label>
                <div class="radio-group" id="purityOptions"></div>
            </div>

            <!-- 5. Craft / Make Type Filter (Radio Group) -->
            <div class="filter-field">
                <label>Craft / Make Type</label>
                <div class="radio-group" id="makeOptions"></div>
            </div>

            <!-- 6. Price Range Filter (Slider + Tier Pills) -->
            <div class="filter-field">
                <div style="display:flex; justify-content: space-between; align-items:center;">
                    <label>Max Price Filter</label>
                    <span id="priceValBadge" style="font-size:11px; font-weight:700; color:var(--primary);">≤
                        ₹1,00,000</span>
                </div>
                <div class="range-box" style="margin-top:6px;">
                    <input type="range" id="maxPriceInput" min="1000" max="100000" step="1000" value="100000"
                        oninput="onMaxPriceChange(this.value)" />
                </div>
                <div class="pill-group" style="margin-top:8px;">
                    <button class="pill-btn price-pill active" onclick="setPricePreset(100000)">All</button>
                    <button class="pill-btn price-pill" onclick="setPricePreset(2500)">Under ₹2.5k</button>
                    <button class="pill-btn price-pill" onclick="setPricePreset(5000)">Under ₹5k</button>
                    <button class="pill-btn price-pill" onclick="setPricePreset(10000)">Under ₹10k</button>
                </div>
            </div>

            <!-- 7. Stock Availability Filter (Checkbox) -->
            <div class="filter-field">
                <label class="checkbox-item" id="stockCheckboxItem" style="margin-top:4px;">
                    <span style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="stockCheckbox" onchange="onStockToggle(this.checked)" />
                        <span>Ready in Stock Only</span>
                    </span>
                </label>
            </div>

            <!-- 8. Sort Order (Radio Group) -->
            <div class="filter-field">
                <label>Sort By Order</label>
                <div class="radio-group" id="sortOptions">
                    <label class="radio-item active">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="sort_radio" value="default" checked
                                onchange="onSortRadioChange('default')" />
                            <span>Newest First</span>
                        </span>
                    </label>
                    <label class="radio-item">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="sort_radio" value="price_asc"
                                onchange="onSortRadioChange('price_asc')" />
                            <span>Price: Low to High</span>
                        </span>
                    </label>
                    <label class="radio-item">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="sort_radio" value="price_desc"
                                onchange="onSortRadioChange('price_desc')" />
                            <span>Price: High to Low</span>
                        </span>
                    </label>
                    <label class="radio-item">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="sort_radio" value="discount_desc"
                                onchange="onSortRadioChange('discount_desc')" />
                            <span>Highest Discount</span>
                        </span>
                    </label>
                </div>
            </div>

            <button class="btn-reset-sidebar" onclick="resetFilters()">
                <i class="ph-bold ph-arrows-counter-clockwise"></i> Reset All Filters
            </button>
        </div>
    </aside>

    <!-- ================= MAIN PRODUCTS DISPLAY ================= -->
    <main class="main-wrapper">
        <header class="top-bar">
            <div class="title-box">
                <h1>Silver Jewelry Catalog</h1>
                <p id="catalogCount">Loading live inventory...</p>
            </div>

            <div class="top-actions">
                <button class="btn btn-secondary" onclick="toggleTheme()" id="themeToggleBtn">
                    <i class="ph-bold ph-moon" id="themeIcon"></i>
                    <span id="themeToggleText">Dark Mode</span>
                </button>
                <a href="/index.html" class="btn btn-secondary">
                    <i class="ph-bold ph-gear"></i>
                    <span>Admin Studio</span>
                </a>
            </div>
        </header>

        <div class="content-area">
            <div class="products-grid" id="productsGrid"></div>
        </div>
    </main>

    <script>
        let allProducts = [];
        let filteredProducts = [];

        let selectedAudience = '';
        let selectedCategory = '';
        let selectedPurity = '';
        let selectedMake = '';
        let maxPrice = 100000;
        let stockOnly = false;
        let selectedSort = 'default';

        // Theme management with LocalStorage
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            applyTheme(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const themeIcon = document.getElementById('themeIcon');
            const themeToggleText = document.getElementById('themeToggleText');
            const sidebarThemeIcon = document.getElementById('sidebarThemeIcon');

            if (theme === 'dark') {
                if (themeIcon) themeIcon.className = 'ph-bold ph-sun';
                if (themeToggleText) themeToggleText.innerText = 'Light Mode';
                if (sidebarThemeIcon) sidebarThemeIcon.className = 'ph-bold ph-sun';
            } else {
                if (themeIcon) themeIcon.className = 'ph-bold ph-moon';
                if (themeToggleText) themeToggleText.innerText = 'Dark Mode';
                if (sidebarThemeIcon) sidebarThemeIcon.className = 'ph-bold ph-moon';
            }
        }

        async function fetchCatalogData() {
            try {
                const res = await fetch('/api/fetch');
                const json = await res.json();
                if (!json.success) throw new Error(json.status || json.error);

                allProducts = json.data || [];
                filteredProducts = [...allProducts];

                populateFilterOptions(allProducts);
                applyAllFilters();

            } catch (err) {
                console.error("Failed to fetch catalog:", err);
                document.getElementById('productsGrid').innerHTML = `
                    <div class="empty-state">
                        <i class="ph-bold ph-warning-circle" style="color: var(--danger);"></i>
                        <h3>Failed to Load Catalog</h3>
                        <p style="color:var(--text-muted); margin-top:6px;">${err.message}</p>
                    </div>
                `;
            }
        }

        function populateFilterOptions(products) {
            // Category options
            const catContainer = document.getElementById('categoryOptions');
            if (catContainer) {
                const categories = [...new Set(products.map(p => p.category_name).filter(Boolean))];
                let catHTML = `
                    <label class="radio-item ${!selectedCategory ? 'active' : ''}">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="category_radio" value="" ${!selectedCategory ? 'checked' : ''} onchange="onCategoryRadioChange('')" />
                            <span>All Categories</span>
                        </span>
                        <span class="count-badge">${products.length}</span>
                    </label>
                `;
                categories.forEach(c => {
                    const count = products.filter(p => p.category_name === c).length;
                    const isChecked = selectedCategory === c;
                    catHTML += `
                        <label class="radio-item ${isChecked ? 'active' : ''}">
                            <span style="display:flex; align-items:center; gap:8px;">
                                <input type="radio" name="category_radio" value="${c}" ${isChecked ? 'checked' : ''} onchange="onCategoryRadioChange('${c}')" />
                                <span>${c}</span>
                            </span>
                            <span class="count-badge">${count}</span>
                        </label>
                    `;
                });
                catContainer.innerHTML = catHTML;
            }

            // Purity options
            const purityContainer = document.getElementById('purityOptions');
            if (purityContainer) {
                const purities = [...new Set(products.map(p => p.purity).filter(Boolean))];
                let purityHTML = `
                    <label class="radio-item ${!selectedPurity ? 'active' : ''}">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="purity_radio" value="" ${!selectedPurity ? 'checked' : ''} onchange="onPurityRadioChange('')" />
                            <span>All Purities</span>
                        </span>
                    </label>
                `;
                purities.forEach(pur => {
                    const isChecked = selectedPurity === pur;
                    purityHTML += `
                        <label class="radio-item ${isChecked ? 'active' : ''}">
                            <span style="display:flex; align-items:center; gap:8px;">
                                <input type="radio" name="purity_radio" value="${pur}" ${isChecked ? 'checked' : ''} onchange="onPurityRadioChange('${pur}')" />
                                <span>${pur}</span>
                            </span>
                        </label>
                    `;
                });
                purityContainer.innerHTML = purityHTML;
            }

            // Make / Craft options
            const makeContainer = document.getElementById('makeOptions');
            if (makeContainer) {
                const makes = [...new Set(products.map(p => p.make_type).filter(Boolean))];
                let makeHTML = `
                    <label class="radio-item ${!selectedMake ? 'active' : ''}">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="make_radio" value="" ${!selectedMake ? 'checked' : ''} onchange="onMakeRadioChange('')" />
                            <span>All Crafts / Makes</span>
                        </span>
                    </label>
                `;
                makes.forEach(m => {
                    const isChecked = selectedMake === m;
                    makeHTML += `
                        <label class="radio-item ${isChecked ? 'active' : ''}">
                            <span style="display:flex; align-items:center; gap:8px;">
                                <input type="radio" name="make_radio" value="${m}" ${isChecked ? 'checked' : ''} onchange="onMakeRadioChange('${m}')" />
                                <span>${m}</span>
                            </span>
                        </label>
                    `;
                });
                makeContainer.innerHTML = makeHTML;
            }
        }

        function setAudience(aud) {
            selectedAudience = aud;
            document.querySelectorAll('#audiencePills .pill-btn').forEach(btn => {
                if (btn.getAttribute('data-val') === aud) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            applyAllFilters();
        }

        function onCategoryRadioChange(val) {
            selectedCategory = val;
            populateFilterOptions(allProducts);
            applyAllFilters();
        }

        function onPurityRadioChange(val) {
            selectedPurity = val;
            populateFilterOptions(allProducts);
            applyAllFilters();
        }

        function onMakeRadioChange(val) {
            selectedMake = val;
            populateFilterOptions(allProducts);
            applyAllFilters();
        }

        function onMaxPriceChange(val) {
            maxPrice = Number(val);
            document.getElementById('priceValBadge').innerText = `≤ ₹${maxPrice.toLocaleString('en-IN')}`;
            applyAllFilters();
        }

        function setPricePreset(val) {
            maxPrice = val;
            const input = document.getElementById('maxPriceInput');
            if (input) input.value = val;
            document.getElementById('priceValBadge').innerText = `≤ ₹${val.toLocaleString('en-IN')}`;
            document.querySelectorAll('.price-pill').forEach(btn => {
                const isMatch = (val === 100000 && btn.innerText.includes('All')) ||
                    (val === 2500 && btn.innerText.includes('2.5k')) ||
                    (val === 5000 && btn.innerText.includes('5k')) ||
                    (val === 10000 && btn.innerText.includes('10k'));
                if (isMatch) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            applyAllFilters();
        }

        function onStockToggle(checked) {
            stockOnly = checked;
            const item = document.getElementById('stockCheckboxItem');
            if (item) {
                if (checked) item.classList.add('active');
                else item.classList.remove('active');
            }
            applyAllFilters();
        }

        function onSortRadioChange(val) {
            selectedSort = val;
            document.querySelectorAll('#sortOptions .radio-item').forEach(lbl => {
                const radio = lbl.querySelector('input[type="radio"]');
                if (radio && radio.value === val) {
                    lbl.classList.add('active');
                } else {
                    lbl.classList.remove('active');
                }
            });
            applyAllFilters();
        }

        function renderProductCards(products) {
            const grid = document.getElementById('productsGrid');
            const countElem = document.getElementById('catalogCount');
            grid.innerHTML = '';

            countElem.innerText = `Showing ${products.length} exclusive silver pieces`;

            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="ph-bold ph-magnifying-glass"></i>
                        <h3>No Products Found</h3>
                        <p style="color:var(--text-muted); margin-top:6px;">No products match your selected filters. Try changing or resetting your filters.</p>
                    </div>
                `;
                return;
            }

            products.forEach(p => {
                let imgUrl = 'https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=600&q=80';
                if (p.images && p.images.length > 0 && p.images[0].image_url) {
                    imgUrl = p.images[0].image_url;
                }

                const hasDiscount = p.discount && Number(p.discount) > 0;
                const effectivePrice = p.final_price !== undefined ? Number(p.final_price) : Number(p.price);
                const finalPriceFormatted = effectivePrice.toLocaleString('en-IN');
                const origPriceFormatted = Number(p.price).toLocaleString('en-IN');
                const inStock = p.quantity && Number(p.quantity) > 0;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="card-media">
                        ${hasDiscount ? `<span class="badge-discount">${p.discount}% OFF</span>` : ''}
                        <span class="badge-category">${p.category_name || 'Silver'}</span>
                        <span class="badge-purity">${p.purity || '92.5'}</span>
                        <img src="${imgUrl}" alt="${p.product_name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=600&q=80'" />
                    </div>

                    <div class="card-body">
                        <h3 class="product-title" title="${p.product_name}">${p.product_name}</h3>
                        <p class="product-desc">${p.description || 'Authentic pure silver jewelry design.'}</p>

                        <div class="specs-row">
                            <span class="spec-pill"><i class="ph-bold ph-scales"></i> ${p.weight || 'N/A'}</span>
                            <span class="spec-pill audience-pill"><i class="ph-bold ph-user"></i> ${p.ideal_for || 'ALL'}</span>
                            ${p.make_type ? `<span class="spec-pill"><i class="ph-bold ph-hammer"></i> ${p.make_type}</span>` : ''}
                        </div>

                        <div class="price-section">
                            <div>
                                <span class="final-price">₹${finalPriceFormatted}</span>
                                ${hasDiscount ? `<span class="original-price">₹${origPriceFormatted}</span>` : ''}
                            </div>
                            <span class="stock-tag ${inStock ? 'in-stock' : 'out-of-stock'}">
                                <i class="ph-fill ph-circle"></i>
                                ${inStock ? `${p.quantity} In Stock` : 'Sold Out'}
                            </span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function applyAllFilters() {
            const searchQueryInput = document.getElementById('searchInput');
            const searchQuery = searchQueryInput ? searchQueryInput.value.toLowerCase().trim() : '';

            filteredProducts = allProducts.filter(p => {
                // 1. Search Query Filter
                const matchesSearch = !searchQuery ||
                    (p.product_name && p.product_name.toLowerCase().includes(searchQuery)) ||
                    (p.description && p.description.toLowerCase().includes(searchQuery));

                // 2. Strict Audience Filter
                const pAudience = (p.ideal_for || '').trim();
                const matchesAudience = !selectedAudience || (pAudience.toLowerCase() === selectedAudience.toLowerCase());

                // 3. Category Filter
                const matchesCategory = !selectedCategory || p.category_name === selectedCategory;

                // 4. Purity Filter
                const matchesPurity = !selectedPurity || p.purity === selectedPurity;

                // 5. Make Filter
                const matchesMake = !selectedMake || p.make_type === selectedMake;

                // 6. Price Filter
                const effectivePrice = p.final_price !== undefined ? Number(p.final_price) : Number(p.price);
                const matchesPrice = effectivePrice <= maxPrice;

                // 7. Stock Availability Filter
                const matchesStock = !stockOnly || Number(p.quantity) > 0;

                return matchesSearch && matchesAudience && matchesCategory && matchesPurity && matchesMake && matchesPrice && matchesStock;
            });

            // 8. Sorting
            if (selectedSort === 'price_asc') {
                filteredProducts.sort((a, b) => (a.final_price || a.price) - (b.final_price || b.price));
            } else if (selectedSort === 'price_desc') {
                filteredProducts.sort((a, b) => (b.final_price || b.price) - (a.final_price || a.price));
            } else if (selectedSort === 'discount_desc') {
                filteredProducts.sort((a, b) => (b.discount || 0) - (a.discount || 0));
            } else {
                filteredProducts.sort((a, b) => b.product_id - a.product_id);
            }

            renderProductCards(filteredProducts);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            selectedAudience = '';
            selectedCategory = '';
            selectedPurity = '';
            selectedMake = '';
            maxPrice = 100000;
            stockOnly = false;
            selectedSort = 'default';

            const maxPriceInput = document.getElementById('maxPriceInput');
            if (maxPriceInput) maxPriceInput.value = 100000;

            const priceValBadge = document.getElementById('priceValBadge');
            if (priceValBadge) priceValBadge.innerText = '≤ ₹1,00,000';

            const stockCheckbox = document.getElementById('stockCheckbox');
            if (stockCheckbox) stockCheckbox.checked = false;

            const stockItem = document.getElementById('stockCheckboxItem');
            if (stockItem) stockItem.classList.remove('active');

            // Reset pill buttons
            document.querySelectorAll('#audiencePills .pill-btn').forEach(btn => {
                if (btn.getAttribute('data-val') === '') btn.classList.add('active');
                else btn.classList.remove('active');
            });

            // Reset sort radio
            document.querySelectorAll('#sortOptions .radio-item').forEach(lbl => {
                const radio = lbl.querySelector('input[type="radio"]');
                if (radio && radio.value === 'default') {
                    radio.checked = true;
                    lbl.classList.add('active');
                } else {
                    if (radio) radio.checked = false;
                    lbl.classList.remove('active');
                }
            });

            populateFilterOptions(allProducts);
            applyAllFilters();
        }

        initTheme();
        fetchCatalogData();
    </script>
</body>

</html>
